name: password-policy
version: 0.1.0

description: |
  Password policies for Crystal, following the CNIL 2022 recommendation
  (délibération 2022-100): the three entropy tiers, the composition rules
  that satisfy them, and passphrase support. Framework-agnostic, and no
  hashing — that belongs to your auth stack.

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.19.0"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
